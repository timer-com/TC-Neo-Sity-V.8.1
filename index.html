.dash{position:absolute;bottom:0;left:0;right:0;height:15vh;background:linear-gradient(#1e293b,#090d16);border-top:2px solid #38bdf8;display:flex;justify-content:space-around;align-items:center}
#whl{width:74px;height:74px;border:7px solid #0f172a;outline:2px solid #38bdf8;border-radius:50%}
.ped{width:22px;height:40px;background:#334155;border:1px solid #64748b;border-radius:4px}.ped.a{background:#38bdf8}
#md{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;justify-content:center;align-items:center;z-index:80;padding:10px}
.mb{background:#0f172a;border:1px solid #38bdf8;border-radius:12px;width:100%;max-width:620px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:9px 12px;background:#1e293b;display:flex;justify-content:space-between;align-items:center}
.mby{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:7px}
.cd{background:#1e293b;border-radius:8px;padding:7px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:11px}
#ts{position:fixed;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;z-index:90;pointer-events:none}
.tst{background:#0f172a;border-left:3px solid #38bdf8;padding:5px 10px;border-radius:6px;font-size:11.5px}
#mob{display:none;position:fixed;bottom:50px;left:8px;right:120px;justify-content:space-between;pointer-events:none;z-index:35}
.dp{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px;pointer-events:auto}
.tb{background:rgba(30,41,59,.8);border:1px solid #38bdf8;border-radius:8px;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}

input{background:#020617;border:1px solid #334155;color:#fff;padding:5px 7px;border-radius:5px;font-size:11.5px}
</style>

<script>
setTimeout(()=>{const s=document.getElementById('sp');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),400);}},1600);
const SK='m3d_c1',DEF={cash:500,bank:1000,debt:0,mtc:2.5,pts:100,hp:100,en:100,fuel:100,chp:100,stars:0,gems:0,spinT:0,job:'un',xp:0,skin:'def',skins:['def'],pet:null,pets:[],car:'sed',cars:['sed'],cCol:'',cLv:1,heli:null,helis:[],wep:'fist',weps:['fist'],houses:[],biz:[],codes:[],user:null,bag:[{id:'cof',n:'Эспрессо',cnt:2,en:30},{id:'fix',n:'Ремкомплект',cnt:1}],px:-4,pz:14,cx:4,cz:12,cr:0,hx:0,hy:.12,hz:22,hr:0,time:12};
let S=JSON.parse(JSON.stringify(DEF));try{const d=localStorage.getItem(SK);if(d)S={...DEF,...JSON.parse(d)};}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}};
const toast=m=>{const t=document.createElement('div');t.className='tst';t.innerText=m;document.getElementById('ts').appendChild(t);setTimeout(()=>t.remove(),2400);};

const JOBS=[{id:'un',t:'Безработный',p:0,x:0,e:0},{id:'cur',t:'Курьер',p:220,x:0,e:12},{id:'tax',t:'Таксист',p:380,x:40,e:15},{id:'dev',t:'3D-Разработчик',p:850,x:150,e:20},{id:'ceo',t:'Магнат Сити',p:4500,x:900,e:30}];
const BIZ=[{id:'ksk',n:'Кофе-киоск',p:1500,inc:60},{id:'wash',n:'Автомойка',p:4500,inc:200},{id:'club',n:'Неон-Клуб',p:14000,inc:680},{id:'twr',n:'IT-Небоскрёб',p:45000,inc:2400}];
const SKINS=[{id:'def',n:'Горожанин',p:0,s:'#3b82f6',l:'#1e293b',spd:1},{id:'biz',n:'Бизнесмен',p:800,s:'#111827',l:'#111827',spd:1.08},{id:'cyb',n:'Неон Хакер',p:2400,s:'#9333ea',l:'#0f172a',h:'v',spd:1.18},{id:'kng',n:'Император',p:9000,s:'#f59e0b',l:'#b45309',h:'c',spd:1.32},{id:'adm',n:'Админ Сити',p:9e8,s:'#dc2626',l:'#090d16',h:'c',spd:1.55,sec:1}];
const PETS=[{id:'dog',n:'Робо-Пёс',p:1200,c:'#cbd5e1',b:'+15% очков'},{id:'cat',n:'Неон-Кот',p:2500,c:'#a855f7',b:'+20% энергии'},{id:'drn',n:'Дрон X1',p:5500,c:'#f59e0b',b:'+25% ЗП'}];
const CARS=[{id:'sed',n:'Седан (95 км/ч)',p:0,m:95,a:28,c:'#e11d48'},{id:'suv',n:'Джип (130 км/ч)',p:3500,m:130,a:34,c:'#0284c7'},{id:'hyp',n:'Гиперкар (225 км/ч)',p:16000,m:225,a:60,c:'#facc15'}];
const HELIS=[{id:'bel',n:'CityHawk Bell',p:8500,s:50,l:16,c:'#0284c7'},{id:'gld',n:'Golden Air',p:45000,s:90,l:28,c:'#f59e0b'}];
const WEPS=[{id:'fist',n:'Кулаки',p:0,d:25,r:2.5,rt:.4},{id:'bat',n:'Бита',p:350,d:45,r:3.2,rt:.45},{id:'gun',n:'Glock-19',p:1500,d:55,r:38,rt:.35,g:1},{id:'m4',n:'M4A1',p:4800,d:85,r:55,rt:.18,g:1}];
const HOUSES=[{id:'st',n:'Студия Парк',p:2500},{id:'lf',n:'Лофт Сити',p:6500},{id:'vl',n:'Вилла Берег',p:18000}];
const ITEMS=[{id:'cof',n:'Эспрессо',p:45,en:30},{id:'brg',n:'Бургер',p:110,en:75},{id:'med',n:'Аптечка',p:150,hp:100},{id:'fix',n:'Ремкомплект',p:200}];
let mtcP=145,rain=0;const bizInc=()=>S.biz.reduce((a,id)=>a+(BIZ.find(x=>x.id===id)?.inc||0),0);
setInterval(()=>{mtcP=Math.max(25,+(mtcP+(Math.random()-.48)*8).toFixed(2));if(S.bank>0)S.bank=+(S.bank*1.002).toFixed(2);const inc=bizInc();if(inc>0)S.cash+=inc;if(Math.random()<.18)rain=!rain;upd();},10000);

const cv=document.getElementById('c'),rn=new THREE.WebGLRenderer({canvas:cv,antialias:true});
rn.setSize(innerWidth,innerHeight);rn.setPixelRatio(Math.min(devicePixelRatio,2));rn.shadowMap.enabled=true;
const aniso=rn.capabilities.getMaxAnisotropy?rn.capabilities.getMaxAnisotropy():4;

function tx(t,c1='#e11d48',c2='#1e293b'){
  const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  if(t==='f'){x.fillStyle=c1;x.fillRect(0,0,512,512);x.fillStyle='#1e1b18';x.fillRect(0,0,512,96);x.fillRect(92,148,112,20);x.fillRect(308,148,112,20);[148,364].forEach(e=>{x.fillStyle='#fff';x.fillRect(e-44,190,88,44);x.fillStyle='#0284c7';x.beginPath();x.arc(e,212,20,0,7);x.fill();x.fillStyle='#090d16';x.beginPath();x.arc(e,212,10,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(e-6,205,5,0,7);x.fill();});x.fillStyle='#991b1b';x.fillRect(192,350,128,28);}
  else if(t==='cl'){x.fillStyle=c1;x.fillRect(0,0,512,512);for(let i=0;i<2500;i++){x.fillStyle=i%2?'rgba(255,255,255,.06)':'rgba(0,0,0,.08)';x.fillRect(Math.random()*512,Math.random()*512,2,2);}x.fillStyle=c2;x.fillRect(184,0,144,50);x.fillRect(250,50,12,380);x.fillRect(0,430,512,82);x.fillStyle='#facc15';x.fillRect(232,440,48,56);}
  else if(t==='rd'){x.fillStyle='#1b2028';x.fillRect(0,0,512,512);for(let i=0;i<7000;i++){const s=18+Math.floor(Math.random()*35);x.fillStyle=`rgb(${s},${s+3},${s+7})`;x.fillRect(Math.random()*512,Math.random()*512,2,2);}x.fillStyle='#eab308';x.fillRect(250,0,5,512);x.fillRect(259,0,5,512);x.fillStyle='#e2e8f0';for(let y=10;y<512;y+=64){x.fillRect(125,y,4,32);x.fillRect(383,y,4,32);}}
  else if(t==='gr'){x.fillStyle='#15803d';x.fillRect(0,0,512,512);for(let i=0;i<5000;i++){x.fillStyle=Math.random()>.5?'#16a34a':'#14532d';x.fillRect(Math.random()*512,Math.random()*512,2,5);}}
  else if(t==='tw'){x.fillStyle='#090f1d';x.fillRect(0,0,512,512);for(let r=0;r<12;r++)for(let l=0;l<8;l++){const lit=(r+l)%3!==0;x.fillStyle=lit?((r+l)%2?'#38bdf8':'#fef08a'):'#1e293b';x.fillRect(l*64+6,r*42.6+5,52,32);}}
  else if(t==='br'){x.fillStyle='#7c2d12';x.fillRect(0,0,512,512);for(let y=0;y<512;y+=32)for(let px=-32;px<512;px+=64){x.fillStyle=(px+y)%128===0?'#9a3412':'#852d10';x.fillRect(px+((y/32)%2?32:0)+2,y+2,60,28);}x.fillStyle='#fef3c7';x.fillRect(64,64,128,128);x.fillRect(320,64,128,128);}
  else if(t==='wd'){x.fillStyle='#78350f';x.fillRect(0,0,512,512);x.strokeStyle='#451a03';x.lineWidth=4;for(let y=0;y<512;y+=32){x.beginPath();x.moveTo(0,y);x.lineTo(512,y);x.stroke();}}
  else if(t==='cr'){x.fillStyle=c1;x.fillRect(0,0,512,512);x.fillStyle='rgba(255,255,255,.88)';x.fillRect(216,0,26,512);x.fillRect(270,0,26,512);x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=6;x.strokeRect(20,40,472,432);}
  else if(t==='rmp'){x.fillStyle='#334155';x.fillRect(0,0,512,512);x.fillStyle='#facc15';for(let y=0;y<512;y+=64)x.fillRect(40,y,432,24);}
  else if(t==='tv'){const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#0284c7');g.addColorStop(.5,'#9333ea');g.addColorStop(1,'#f43f5e');x.fillStyle=g;x.fillRect(0,0,512,512);x.fillStyle='#fff';x.font='bold 42px sans-serif';x.fillText('METRO TV LIVE',90,260);}
  const T=new THREE.CanvasTexture(c);T.wrapS=T.wrapT=THREE.RepeatWrapping;T.anisotropy=aniso;return T;
}
const TX={rd:tx('rd'),gr:tx('gr'),tw:tx('tw'),br:tx('br'),wd:tx('wd'),tv:tx('tv'),rmp:tx('rmp')};TX.gr.repeat.set(40,40);TX.wd.repeat.set(6,6);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0f172a);sc.fog=new THREE.FogExp2(0x0f172a,.004);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.2,450);
sc.add(new THREE.HemisphereLight(0xdbeafe,0x1e293b,.9));
const sun=new THREE.DirectionalLight(0xfffbeb,1.1);sun.position.set(80,140,60);sun.castShadow=true;sc.add(sun);

const cg=new THREE.Group(),ig=new THREE.Group();sc.add(cg,ig);
let loc='city',svP={x:0,z:14},cols=[],zns=[],iActs=[],cashier=null;
const addM=(p,g,m,x,y,z,ry=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.rotation.y=ry;o.castShadow=o.receiveShadow=true;p.add(o);return o;};

const gems=[],ramps=[{x:0,z:-45,rz:1},{x:60,z:30,rz:1}],drops=[];
let race={on:0,tm:0,cp:0,pts:[[0,-60],[60,-60],[60,60],[-60,60],[-60,0],[0,0]]};
const raceRing=addM(cg,new THREE.TorusGeometry(3.5,.25,8,24),new THREE.MeshBasicMaterial({color:0xfacc15}),0,2,-60);raceRing.visible=false;

const rGeo=new THREE.BufferGeometry(),rPos=new Float32Array(900);for(let i=0;i<900;i+=3){rPos[i]=(Math.random()-.5)*160;rPos[i+1]=Math.random()*50;rPos[i+2]=(Math.random()-.5)*160;}
rGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
const rPts=new THREE.Points(rGeo,new THREE.PointsMaterial({color:0x7dd3fc,size:.25}));rPts.visible=false;cg.add(rPts);

function buildCity(){
  addM(cg,new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({map:TX.gr,bumpMap:TX.gr,bumpScale:.03}),0,0,0).rotation.x=-Math.PI/2;
  [-120,-60,0,60,120].forEach(c=>{
    const t1=TX.rd.clone();t1.needsUpdate=true;t1.repeat.set(1,22);addM(cg,new THREE.PlaneGeometry(14,320),new THREE.MeshStandardMaterial({map:t1,bumpMap:t1,bumpScale:.02}),c,.03,0).rotation.x=-Math.PI/2;
    const t2=TX.rd.clone();t2.needsUpdate=true;t2.repeat.set(1,22);const r=addM(cg,new THREE.PlaneGeometry(14,320),new THREE.MeshStandardMaterial({map:t2,bumpMap:t2,bumpScale:.02}),0,.04,c);r.rotation.x=-Math.PI/2;r.rotation.z=Math.PI/2;
  });

  else{L.bd.position.y=Math.sin(t*2.4)*.02;L.hd.rotation.y=Math.sin(t*.8)*.18;}
  if(e==='wave'){L.ra.rotation.z=2.7;L.ra.rotation.x=Math.sin(t*14)*.35;}
  else if(e==='dance'){L.bd.position.y=Math.abs(Math.sin(t*9))*.14;L.bd.rotation.z=Math.sin(t*4.5)*.16;L.la.rotation.z=-2.2;L.ra.rotation.z=2.2;}

function buy(t,id){
  if(t==='house'){const h=HOUSES.find(x=>x.id===id);if(S.houses.includes(id)){document.getElementById('md').style.display='none';return enterIn('house');}if(S.cash<h.p)return toast('⚠️ Мало денег!');S.cash-=h.p;S.houses.push(id);save();upd();document.getElementById('md').style.display='none';return enterIn('house');}
  if(t==='item'){const i=ITEMS.find(x=>x.id===id);if(S.cash<i.p)return toast('⚠️ Мало денег!');S.cash-=i.p;const e=S.bag.find(x=>x.id===id);if(e)e.cnt++;else S.bag.push({...i,cnt:1});save();upd();return toast(`🛍️ +${i.n}`);}
  const M={skin:[SKINS,'skins','skin',rbPl],heli:[HELIS,'helis','heli',()=>{rbHeli();heli.position.set(0,.12,22);toast('🚁 Вертолёт на шоссе (0,22)!');}],car:[CARS,'cars','car',rbCar],pet:[PETS,'pets','pet',rbPet],wep:[WEPS,'weps','wep',rbPl]};
  const [L,A,C,F]=M[t],o=L.find(x=>x.id===id);if(S[A].includes(id)){S[C]=id;F();save();return openM(t==='wep'?'gun':'shop');}
  if(S.cash<o.p)return toast('⚠️ Мало денег!');S.cash-=o.p;S[A].push(id);S[C]=id;S.pts+=100;F();emote('cheer');save();upd();openM(t==='wep'?'gun':'shop');
}
function spin(){if(S.cash<100)return;S.cash-=100;const y=['🍒','💎','7️⃣'],r=[0,1,2].map(()=>y[Math.floor(Math.random()*3)]);document.getElementById('sr').innerText=r.join(' ');if(r[0]===r[1]&&r[1]===r[2]){S.cash+=500;emote('dance');toast('🎰 +$500!');}else if(r[0]===r[1]||r[1]===r[2]){S.cash+=180;emote('cheer');toast('🎰 +$180');}else emote('angry');save();upd();}
function uc(){const c=document.getElementById('pi').value.trim().toUpperCase();if(S.codes.includes(c))return;if(c==='ADMIN2026'){S.cash=S.bank=999999999;S.xp=999999;if(!S.skins.includes('adm'))S.skins.push('adm');S.skin='adm';rbPl();emote('dance');toast('👑 АДМИН АКТИВИРОВАН!');}else if(c==='START2026'){S.cash+=1500;toast('🎁 +$1500');}else if(c==='CRYPTOVIP'){S.mtc+=5;toast('🎁 +5 MTC');}else if(c==='MEGA10K'){S.cash+=10000;toast('🎁 +$10000');}else return toast('❌ Неверный код');S.codes.push(c);save();upd();document.getElementById('md').style.display='none';}
function ub(i){const it=S.bag[i];if(it.id==='fix'){S.chp=S.fuel=100;toast('🔧 Авто отремонтировано и заправлено!');}else{if(it.en)S.en=Math.min(100,S.en+it.en);if(it.hp)S.hp=Math.min(100,S.hp+it.hp);}if(--it.cnt<=0)S.bag.splice(i,1);emote('love');save();upd();openM('bag');}
async function lg(){const u=document.getElementById('ul').value.trim();if(!u)return;S.user=u;save();upd();try{const r=await fetch('https://keyvalue.immanuel.co/api/KeyVal/GetValue/m3d_'+encodeURIComponent(u)),tx=await r.text();if(tx&&tx.length>10){const cl=JSON.parse(JSON.parse(tx));if(cl.pts>S.pts){S={...S,...cl};rbPl();rbCar();rbHeli();rbPet();}}await fetch('https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/m3d_'+encodeURIComponent(u)+'/'+encodeURIComponent(JSON.stringify(S)),{method:'POST'});toast('☁️ Облако синхронизировано!');}catch(e){toast('💾 Сохранено локально');}document.getElementById('md').style.display='none';}

buildCity();rbPl();rbPet();rbCar();rbHeli();pl.position.set(S.px,0,S.pz);car.position.set(S.cx,0,S.cz);car.rotation.y=S.cr;heli.position.set(S.hx,S.hy,S.hz);pet.position.copy(pl.position);upd();
setInterval(()=>{S.px=pl.position.x;S.pz=pl.position.z;S.cx=car.position.x;S.cz=car.position.z;S.cr=car.rotation.y;save();},10000);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);};
let lt=performance.now();(function lp(nw){requestAnimationFrame(lp);const dt=Math.min(.05,(nw-lt)/1000);lt=nw;updP(dt);drawMM();rn.render(sc,cam);})(lt);
</script>
</body>
